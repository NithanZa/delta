name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Trust gates on the shipped demo database. No model calls in CI.
      - run: npm run eval:gates -- --db data/demo/delta.demo.db
